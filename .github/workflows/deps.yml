name: deps
# Once a month: which packages in constraints.txt have newer versions. Report only; it changes nothing.
# To take them: python scripts/lock.py --upgrade, run the tests, and send it as a change (CONTRIBUTING.md).
on:
  schedule:
    - cron: "0 3 1 * *"  # 03:00 UTC on the 1st
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: |
          {
            echo "### Package updates"
            echo
            echo '```'
            python scripts/lock.py --check
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
