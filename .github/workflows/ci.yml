name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # the full matrix by hand (Actions > ci > Run workflow)
# A newer push to the same pull request stops the run still going: minutes aren't spent on an old commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        # Pull requests and main: one Linux and one Windows job (Windows minutes count double). Releases and a
        # run by hand: every Python version Argus supports.
        os: [ubuntu-latest, windows-latest]
        python: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["3.11", "3.12", "3.13"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check core tests scripts
      - run: python -m pytest -q
  helios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helios/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: The committed Helios build matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../core/argus/helios_dist)" ]; then
            git status --short -- ../core/argus/helios_dist
            echo "helios_dist is out of date: run .\scripts\dev.ps1 helios and commit the result."
            exit 1
          fi
  title:
    # The PR title becomes the commit on main: "type(scope): what changed" (CONTRIBUTING.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/change.py check-title "$TITLE"
  ci-ok:
    # The one check GitHub requires before merging: everything above passed.
    if: always()
    needs: [test, helios, title]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.helios.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.title.result }}" = "failure" ] || [ "${{ needs.title.result }}" = "cancelled" ]; then exit 1; fi
