name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check core tests scripts
      - run: python -m pytest -q
  helios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: The committed Helios build matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../core/argus/helios_dist)" ]; then
            git status --short -- ../core/argus/helios_dist
            echo "helios_dist is out of date: run .\scripts\dev.ps1 helios and commit the result."
            exit 1
          fi
  ci-ok:
    # The one check GitHub requires before merging: everything above passed.
    if: always()
    needs: [test, helios]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.helios.result }}" != "success" ]; then exit 1; fi
