# Argus configuration. Copy to argus.yaml and edit.
# The same code runs on the PC (development) and the laptop (after MD); only this file changes.

instance:
  name: argus-dev          # shown in Helios
  host: pc                 # pc while developing, laptop after deploy

server:
  host: 127.0.0.1          # keep on localhost; Tailscale exposes it later
  port: 8600

database:
  path: data/argus.db      # relative paths are relative to this file

logging:
  level: INFO              # DEBUG, INFO, WARNING, ERROR
  file: logs/argus.log     # JSON lines, rotated at 5 MB, 5 files kept

ollama:
  url: http://127.0.0.1:11434
  timeout_seconds: 120     # a model call that takes longer counts as a failure
  keep_alive: 10m          # keep the last model loaded this long

models:
  tiers:                   # cheapest first; a step escalates up the chain when its checks fail
    T1: {provider: ollama, model: "qwen2.5-coder:7b", group: pc}
    T2: {provider: ollama, model: "qwen2.5-coder:14b", group: pc}
    T3: {provider: claude, group: cloud}
  chain: [T1, T2, T3]
  attempts_per_tier: 2     # tries per tier (the second one is told what was wrong)
  breaker_failures: 3      # after 3 failed calls in a row a model is paused ...
  breaker_open_seconds: 60 # ... for this long, and jobs move on instead of waiting

claude:
  command: [claude]        # the Claude Code CLI, logged in with your subscription
  timeout_seconds: 300
  calls_per_day: 30        # hard daily cap across all workers

jobs:
  lease_seconds: 60
  heartbeat_seconds: 15
  max_attempts: 3
  backoff_seconds: [10, 60, 600]
  watchdog_interval_seconds: 5
  plugin_queue_limit: 100

events:
  retention_days: 90       # older events are deleted; the map's edges are kept
  stream_queue: 200        # how far a slow viewer may fall behind before it reconnects

ntfy:
  url: https://ntfy.sh     # phone notifications; the topic is NTFY_TOPIC in .env (keep it hard to guess)

approvals:
  public_url:              # how your phone reaches Argus, e.g. http://192.168.1.20:8600 or the Tailscale name;
                           # empty = no Approve/Reject buttons in the notification (decide in Helios)
  remind_hours: 24         # one reminder if nobody decided
  expire_hours: 168        # then it counts as "no" and the job carries on

power:
  mode: simulated          # simulated on the PC, real on the laptop

paths:
  allowed: []              # folders plugins may touch, e.g. C:/Users/Sas/Downloads
  blocked: []              # never touched, e.g. work folders
