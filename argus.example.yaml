# Argus configuration. Copy to argus.yaml and edit.
# The same code runs on the PC (development) and the laptop (after MD); only this file changes.

instance:
  name: argus-dev          # shown in Helios
  host: pc                 # pc while developing, laptop after deploy

server:
  host: 127.0.0.1          # keep on localhost; Tailscale exposes it later
  port: 8600

database:
  path: data/argus.db      # relative paths are relative to this file

logging:
  level: INFO              # DEBUG, INFO, WARNING, ERROR
  file: logs/argus.log     # JSON lines, rotated at 5 MB, 5 files kept

ollama:
  url: http://127.0.0.1:11434
  timeout_seconds: 120     # a model call that takes longer counts as a failure
  keep_alive: 10m          # keep the last model loaded this long

models:
  tiers:                   # cheapest first; a step escalates up the chain when its checks fail
    T1: {provider: ollama, model: "qwen2.5-coder:7b", group: pc}
    T2: {provider: ollama, model: "qwen2.5-coder:14b", group: pc}
    T3: {provider: claude, group: cloud}
    V1: {provider: ollama, model: "qwen2.5vl:7b", group: pc}   # vision (screenshot-renamer); not in the chain
  chain: [T1, T2, T3]
  attempts_per_tier: 2     # tries per tier (the second one is told what was wrong)
  breaker_failures: 3      # after 3 failed calls in a row a model is paused ...
  breaker_open_seconds: 60 # ... for this long, and jobs move on instead of waiting

claude:
  command: [claude]        # the Claude Code CLI, logged in with your subscription
  timeout_seconds: 300
  calls_per_day: 30        # hard daily cap across all workers
  plugin_calls_per_day: 10 # each plugin's share unless its plugin.yaml sets claude_calls_per_day (0 = never)

ari:
  voice: ""                # a Piper voice (.onnx) for Ari's natural voice; empty: the browser's voice
  hearing: browser         # browser | whisper (Whisper on the PC's GPU; the browser while the PC is off)
  whisper_model: small.en

brief:
  enabled: true
  at: "07:00"              # the morning brief on the phone: overnight results, what waits for you, today's schedules
  weather: ""              # a town ("Colombo", "Kandy, LK"): today's forecast first (Open-Meteo, no key); "" for none

summary:
  enabled: true
  at: "20:00"              # the evening summary: today's jobs, the time they saved you, what failed or waits

health:
  enabled: false           # the PC checks WSL and Docker and tells the phone when something stops
  every_minutes: 30
  containers: []           # must be running, e.g. [eclaire-app, eclaire-db]

jobs:
  lease_seconds: 60
  heartbeat_seconds: 15
  max_attempts: 3
  backoff_seconds: [10, 60, 600]
  watchdog_interval_seconds: 5
  plugin_queue_limit: 100  # jobs of one plugin waiting or running at most; more are refused (back-pressure)
  plugin_concurrency: 1    # jobs of one plugin running at once
  concurrency: {}          # per-plugin exceptions, e.g. {demo: 4}

events:
  retention_days: 90       # older events are deleted; the map's edges are kept
  stream_queue: 200        # how far a slow viewer may fall behind before it reconnects

ntfy:
  url: https://ntfy.sh     # phone notifications; the topic is NTFY_TOPIC in .env (keep it hard to guess)
  quiet: true              # ordinary plugin messages wait for the evening summary; approvals, failures, warnings don't

approvals:
  buttons: tailscale       # tailscale: Approve / Reject go straight to Argus (phone must be on Tailscale)
                           # ntfy: they go through ntfy and work anywhere (only with your own ntfy + login)
  public_url:              # how your phone reaches Argus, e.g. https://saspc.tail1234.ts.net
  phone:                   # your phone's Tailscale name, e.g. pixel-8: when it comes back online, Argus
                           # pushes what is still waiting (checks `tailscale status` every 30 s)
  back_online_cooldown_minutes: 15
  remind_hours: 24         # one reminder if nobody decided
  expire_hours: 168        # then it counts as "no" and the job carries on

windows:                   # named time ranges (local time); a job with window: night only starts inside it
  night: "01:00-06:00"

schedules: []              # cron jobs, e.g.
#  - id: morning-brief
#    plugin: brief
#    workflow: send
#    cron: "0 7 * * *"      # minute hour day month weekday; also @hourly @daily @weekly
#    priority: 50
#  - id: model-scout
#    plugin: scout
#    workflow: run
#    cron: "@daily"
#    window: night          # queued daily, starts in the night window
#    needs: [gpu]
#    model: qwen2.5-coder:14b   # GPU jobs are grouped by model so Ollama swaps rarely

triggers:
  folders: []              # a worker watches a folder on its machine, e.g.
#    - name: downloads
#      plugin: organizer
#      workflow: sort
#      worker: SasPC        # worker id or host name
#      path: C:/Users/Sas/Downloads
#      patterns: ["*"]
#      settle_seconds: 120  # unchanged this long = finished downloading
  webhooks: []             # signed POST /hooks/<name>, e.g.
#    - name: github
#      plugin: review
#      workflow: pr
#      secret_env: GITHUB_HOOK_SECRET   # the secret itself goes in .env
#      style: github

power:
  mode: simulated          # simulated on the PC, real on the laptop
  idle_minutes: 20         # no GPU or desktop work this long -> (would) shut the PC down
  pc_needs: [gpu, desktop] # job needs only the PC can serve
  pc_mac:                  # for the Wake button: the PC's wired card, e.g. 04:7C:16:AB:CD:EF (ipconfig /all)
  shutdown_delay_seconds: 60   # Shut down / Restart wait this long, so Cancel still works

plugins:
  dirs: [plugins]          # one folder per plugin: plugin.yaml + plugin.py
  live: []                 # plugins promoted out of dry-run, e.g. [downloads-organizer]
  config: {}               # per-plugin settings over the manifest defaults, e.g. {downloads-organizer: {...}}

paths:
  allowed: []              # folders plugins may touch, e.g. C:/Users/Sas/Downloads
  blocked: []              # never touched, e.g. work folders
