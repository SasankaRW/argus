[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
dynamic = ["version"]
description = "Argus: local-first orchestrator for your LLM workflows, with the Helios dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
argusd = "argus.daemon:main"
argus-worker = "argus.worker.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
argus = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
