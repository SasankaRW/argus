[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
dynamic = ["version"]
description = "Argus: local-first orchestrator for your LLM workflows, with the Helios dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.35",
  "websockets>=13",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.5", "numpy>=1.24", "pillow>=10", "pypdf>=4"]  # numpy: ari-listen; pillow, pypdf: plugin tests
# used by plugins when present: Recycle Bin deletes, image resizing, OCR (Tesseract itself is a separate install)
plugins = ["send2trash>=1.8", "pillow>=10", "pytesseract>=0.3", "pypdf>=4", "numpy>=1.24", "psutil>=5.9"]
# Ari: a natural voice (Piper, where argusd runs) and hearing (Whisper, on the PC's worker)
voice = ["piper-tts>=1.3"]
hearing = ["faster-whisper>=1.0"]
listen = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24"]
popup = ["PySide6-Essentials>=6.6"]
# training Ari's hearing on your voice (python -m argus.voice_train); PyTorch with CUDA is installed separately
train = ["faster-whisper>=1.0", "transformers>=4.44", "peft>=0.12", "accelerate>=0.30", "safetensors>=0.4"]  # Ari's island at the top of the screen (native Qt, no browser engine)

[project.scripts]
argusd = "argus.daemon:main"
argus-worker = "argus.worker.cli:main"
argus-events = "argus.tail:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
argus = ["db/migrations/*.sql", "helios_dist/*", "helios_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
timeout = 120  # a hung test fails instead of hanging the run
markers = ["brief: let the morning brief run (it depends on the clock)",
           "nightly_backup: let the nightly backup run (it depends on the clock)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"core/argus/api/home.py" = ["E501"]  # inline HTML/CSS/JS
