[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
dynamic = ["version"]
description = "Argus: local-first orchestrator for your LLM workflows, with the Helios dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.35",
  "websockets>=13",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "tzdata; sys_platform == 'win32'",  # time zones by name (Claude's "resets 2:30am (Asia/Colombo)"); Windows has none built in
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pytest-cov>=5", "mypy>=1.10", "types-PyYAML", "httpx>=0.27", "ruff>=0.5", "numpy>=1.24", "pillow>=10", "pypdf>=4"]  # numpy: ari-listen; pillow, pypdf: plugin tests
# used by plugins when present: Recycle Bin deletes, image resizing, OCR (Tesseract itself is a separate install)
# pyvda, playwright, uiautomation: Ari's Workstation (virtual desktops; Ari's browser on the installed Chrome or
# Edge; apps' buttons and fields through UI Automation)
plugins = ["send2trash>=1.8", "pillow>=10", "pytesseract>=0.3", "pypdf>=4", "numpy>=1.24", "psutil>=5.9",
           "pyvda>=0.5; sys_platform == 'win32'", "playwright>=1.45; sys_platform == 'win32'",
           "uiautomation>=2.0.20; sys_platform == 'win32'", "comtypes>=1.4; sys_platform == 'win32'"]
# (comtypes: the Workstation as a child session, argus.child_session)
# the terminal console on the laptop (python -m argus.console; deploy/linux/console-setup.sh)
console = ["rich>=13", "psutil>=5.9"]
# Ari: hearing (Whisper, on the PC's worker). Her voice (Chatterbox) has its own environment: docs/setup.md
# on Windows also CUDA 12's cuBLAS and cuDNN 9, so Whisper runs on the GPU (worker/hear.py cuda_dlls finds them)
hearing = ["faster-whisper>=1.0", "nvidia-cublas-cu12; sys_platform == 'win32'",
           "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'"]
listen = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "soundcard>=0.4.3; sys_platform == 'win32'", "nvidia-cublas-cu12; sys_platform == 'win32'",
          "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'"]
# "Hey Ari" as a wake-word model (ari.wake_model), instead of Whisper reading everything it hears
wake = ["openwakeword>=0.6"]
popup = ["PySide6-Essentials>=6.6", "psutil>=5.9",
         # what's playing on the island's media page (Windows media sessions)
         "winrt-runtime>=2.0; sys_platform == 'win32'", "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
         "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
         "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'"]
# the robot eyes on the cooler's screen (DeepCool LM360, python -m argus.eyes)
eyes = ["pyusb>=1.2", "libusb-package>=1.0", "numpy>=1.24", "pillow>=10"]  # numpy, pillow: making clips
# training Ari's hearing on your voice (python -m argus.voice_train); PyTorch with CUDA is installed separately
train = ["faster-whisper>=1.0", "transformers>=4.44", "peft>=0.12", "accelerate>=0.30", "safetensors>=0.4"]  # Ari's island at the top of the screen (native Qt, no browser engine)

[project.scripts]
argusd = "argus.daemon:main"
argus-worker = "argus.worker.cli:main"
argus-events = "argus.tail:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
argus = ["db/migrations/*.sql", "helios_dist/*", "helios_dist/**/*", "island_fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
timeout = 120  # a hung test fails instead of hanging the run
markers = ["brief: let the morning brief run (it depends on the clock)",
           "nightly_backup: let the nightly backup run (it depends on the clock)"]

[tool.mypy]
# The type check starts loose, on three areas: the models, the database and the API (python -m mypy).
# CI reports the error count and never fails on it yet; widen `files` and tighten as the count comes down.
files = ["core/argus/models", "core/argus/db", "core/argus/api"]
mypy_path = "core"
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"

[tool.coverage.run]
# CI shows how much of this the tests run (report only: it never fails a build)
source = ["core/argus", "plugins"]
omit = ["core/argus/helios_dist/*"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"core/argus/api/home.py" = ["E501"]  # inline HTML/CSS/JS
