# Argus on the laptop (after the move). Copied to /opt/argus/argus.yaml by install.sh; edit it there.
instance:
  name: argus
  host: laptop

server:
  host: 127.0.0.1          # Tailscale (tailscale serve) is the only way in from outside
  port: 8600

logging: {level: INFO, file: logs/argus.log}

ollama:
  url: http://127.0.0.1:11434  # as the PC worker sees it (Ollama runs on the PC; the laptop never loads models)

models:
  tiers:
    T1: {provider: ollama, model: "qwen2.5-coder:7b", group: pc}
    T2: {provider: ollama, model: "qwen2.5-coder:14b", group: pc}
    T3: {provider: claude, group: cloud}
    V1: {provider: ollama, model: "qwen2.5vl:7b", group: pc}
  chain: [T1, T2, T3]
  needs: [gpu]             # model work (Ari's replies, Ask) runs on the PC's worker; the laptop wakes the PC for it

power:
  mode: real               # wake the PC for GPU/desktop work, shut it down when idle (with a phone warning)
  idle_minutes: 20
  warn_minutes: 5
  pc_mac:                  # the PC's wired card (ipconfig /all), e.g. 04:7C:16:AB:CD:EF
  wol_broadcast: 255.255.255.255

backup:
  at: "02:30"
  keep: 5
  copy_to: G:/ArgusBackups # a folder on the PC: its worker fetches each night's backup

approvals:
  public_url:              # the laptop's Tailscale https address, e.g. https://laptop.tail65c634.ts.net
  phone: pixel-8a

plugins:
  live: [downloads-organizer, screenshot-renamer]
  # A plugin whose address is 127.0.0.1 must run where that service is (its jobs could otherwise land on either
  # machine). argusd --check warns about the ones that need this.
  runs_on: {web: desktop, lifehub: desktop, tracker: laptop}   # SearXNG and Life Hub on the PC, Tracker here
  config:
    tracker: {url: "http://127.0.0.1:8282"}

ari:
  voice_engine: piper      # the expressive voice lives on the PC: its listener makes it there (its own argus.yaml)
  voice: data/voices/en_US-lessac-medium.onnx   # Piper here, for Helios and the phone (pip install -e ".[voice]")
