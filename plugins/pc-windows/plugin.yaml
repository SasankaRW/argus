id: pc-windows
name: PC windows
version: 1.0.0
kind: workflow
argus_api: ">=1.0 <2.0"
description: Lets Ari switch to a window, show the desktop, lock the PC and take a screenshot.
runs_on: desktop
needs: [session]

workflows: [switch, desktop, lock, screenshot]

permissions:
  files: {read: ["~/Pictures/Screenshots"], write: ["~/Pictures/Screenshots"], delete: none}
  models: []

ari:
  tools:
    - name: switch_to_window
      description: Bring an open app's window to the front (Chrome, Spotify, VS Code, ...).
      workflow: switch
      input: {name: {type: string, description: the app or window title}}
      required: [name]
    - name: show_desktop
      description: Minimise all windows (show the desktop).
      workflow: desktop
    - name: lock_pc
      description: Lock the PC (like Windows+L).
      workflow: lock
    - name: take_screenshot
      description: Take a screenshot of the screen (saved in Pictures/Screenshots, then named by screenshot-renamer).
      workflow: screenshot

helios:
  node: {label: PC windows, group: pc}
