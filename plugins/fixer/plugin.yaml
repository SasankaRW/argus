id: fixer
name: Ticket fixer
version: 0.4.0
kind: workflow
argus_api: ">=1.0 <2.0"
description: 'Fixes Tracker tickets in two phases (plan, then execute), each with its own Claude model. PLAN: a ticket labelled "ai-fix" in a mapped project is read in the project folder (read-only), the plan is attached to the ticket and you are asked before any fix runs. EXECUTE: the approved fix is made on a new git branch in a worktree, with tests and proof (screenshots, logs) attached to the ticket; it never pushes or merges. See docs/ticket-fixer-plan.md.'
runs_on: desktop

triggers:
  - schedule: {workflow: scan, cron: "*/2 * * * *"}   # ai-fix tickets get a plan, fix-approved tickets get their fix
  - schedule: {workflow: ask, cron: "*/2 * * * *"}    # a ready plan gets the phone / Helios approval question

workflows: [scan, ask, plan, fix, queue, approve, terminal, status]

permissions:
  files: {read: [], write: [], delete: none}   # project folders come from "projects" below; the plugin only runs Claude inside those
  models: []
  network: ["config:tracker_url"]
  secrets: [TRACKER_API_KEY]
  claude_calls_per_day: 0                       # it runs the claude CLI itself (fixes_per_day), not Argus's text-only Claude

config:
  tracker_url: {type: text, default: "http://127.0.0.1:8080", label: Tracker address}
  projects:
    type: list
    default: []
    label: "Projects Claude may work in, one per line: KEY | folder | test command | plan model | fix model (the last three are optional)"
  screens:
    type: list
    default: []
    label: "Automatic screenshots of a UI fix, one per line: KEY | the folder the build fills, e.g. web/dist | pages, e.g. /, /?view=board (default /). Argus photographs the app before and after the fix at desktop and phone size, with the real Tracker data (read only). The project's test command must build the app."
  browser_command: {type: text, default: "", label: "Edge or Chrome for those screenshots (empty: found automatically)"}
  plan_model: {type: text, default: opus, label: "Plan model (opus, sonnet, haiku or a full claude-... id)"}
  fix_model: {type: text, default: sonnet, label: "Fix model (used by the execute phase)"}
  claude_command: {type: text, default: claude, label: The claude command (or a full path to it)}
  plan_minutes: {type: int, default: 10, label: Minutes a plan may take}
  fix_minutes: {type: int, default: 30, label: Minutes the fix itself may take}
  test_minutes: {type: int, default: 10, label: Minutes a test run may take (it runs before and after the fix)}
  fix_allow:
    type: list
    default: ["npm run *", "npm test*", "npm ci", "npx playwright *", "npx vitest *", "node *", "python -m pytest*", "pytest*", "git status*", "git diff*", "git log*", "git show*"]
    label: "Commands the fixing Claude may run (besides editing files). Add yours, e.g. docker compose *. git commit, push and web access are always refused."
  require_screenshots: {type: bool, default: false, label: "A UI fix must come with before/after screenshots (off: it goes to review with a note instead)"}
  fixes_per_day: {type: int, default: 6, label: Plans and fixes per day}

ari:
  tools:
    - name: fix_ticket
      description: "Start the AI fix for a Tracker ticket: it is queued, Claude reads the project's code (read-only) in the background, attaches a fix plan to the ticket and the user is asked before any fix runs. Optionally name the models."
      workflow: queue
      risky: true
      input:
        key: {type: string, description: "the issue key, e.g. ACME-12"}
        plan_model: {type: string, description: "model for the plan: opus, sonnet or haiku (optional)"}
        fix_model: {type: string, description: "model for the fix: opus, sonnet or haiku (optional)"}
      required: [key]
    - name: run_fix
      description: "Approve and start the fix for a Tracker ticket that already has a plan: Claude edits the project on a new git branch, runs the tests and saves proof (screenshots, logs); it all goes on the ticket and the ticket moves to review. Never pushes or merges."
      workflow: approve
      risky: true
      input:
        key: {type: string, description: "the issue key, e.g. ACME-12"}
        fix_model: {type: string, description: "model for the fix: opus, sonnet or haiku (optional)"}
      required: [key]
    - name: fix_status
      description: Which Tracker tickets are being planned or fixed, and at what stage (waiting for a plan, plan ready, approved, fixing, done, failed). Give a key for one ticket.
      workflow: status
      input:
        key: {type: string, description: "the issue key, e.g. ACME-12 (optional)"}

helios:
  node: {label: Ticket fixer, group: assistant}
