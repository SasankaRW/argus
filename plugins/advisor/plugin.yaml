id: advisor
name: Money advisor
version: 1.0.0
kind: workflow
argus_api: ">=1.0 <2.0"
description: 'Words and web for Life Hub''s finance advisor: plain-language advice from the numbers Life Hub works out from Cashly (local models, or Claude with totals only, as you pick in Life Hub), cheaper options for wishlist items (SearXNG), and last month''s PDF report on the 1st.'
runs_on: any

triggers:
  - schedule: {workflow: monthly, cron: "0 9 1 * *"}   # 9 am on the 1st: last month's report
  - manual: {workflow: monthly, label: Make last month's money report now}

workflows: [advise, alternatives, monthly]

permissions:
  files: {read: [], write: [], delete: none}
  models: [T1, T2]              # advice and picking alternatives (local)
  claude_calls_per_day: 15      # only when Life Hub asks for Claude (monthly review, big purchases, or you chose it)
  network: ["config:lifehub_url"]
  secrets: [LIFEHUB_API_KEY]

config:
  lifehub_url: {type: text, default: "http://127.0.0.1:8081", label: Life Hub address}

helios:
  node: {label: Money advisor, group: assistant}
