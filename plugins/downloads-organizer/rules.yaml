# How downloads are sorted. Edit freely: the worker reads this file when it loads the plugin (restart the worker
# after a change). The main tuning knob is `guidance`: add a line when it gets something wrong.

categories:
  Documents: PDFs, Word/Excel/PowerPoint files, ebooks, text notes, invoices, reports, papers, CVs
  Images: photos, screenshots, icons, wallpapers, logos, design exports (png, jpg, webp, svg, psd, ai)
  Videos: video files and screen recordings (mp4, mkv, mov, avi, webm)
  Media: "audio files: music, podcasts, voice notes, samples (mp3, wav, flac, m4a, ogg)"
  Archives: compressed bundles that are not installers (zip, rar, 7z, tar, gz) - fonts packs, icon packs, asset bundles
  Installers: software setup files and app packages (exe, msi, dmg, appx, apk, deb, iso of software)
  Projects: source code, notebooks, datasets, repo exports, model weights, anything tied to a coding or research project
  Web: saved web pages, html exports, bookmarks, browser downloads that are page captures
  Private: bank statements, ID scans, payslips, medical documents, contracts, anything personal or sensitive
  Misc: anything that does not clearly fit another category

aliases: {Miscellaneous: Misc, Pictures: Images, Audio: Media, Music: Media, Code: Projects, Software: Installers}

guidance:
  - Source code, scripts, notebooks, datasets, model weights and repo/zip exports of a codebase go to Projects - never to Documents or Archives.
  - A .py .js .ts .java .c .cpp .ipynb .sql or .sh file is always Projects, whatever it is named.
  - Setup/installer binaries (exe, msi, apk, appx) go to Installers even when the archive also contains documents.
  - A zip/rar/7z goes to Archives only if it is NOT a code export and NOT an installer.
  - Bank statements, payslips, ID scans, medical reports and contracts go to Private, not Documents.
  - Screenshots and screen recordings go to Images and Videos respectively.
  - Pick Misc only when nothing else plausibly fits - it is a last resort, not a default.

examples:
  train_model.py: Projects
  Screenshot 2026-09-08 214501.png: Images
  VSCodeUserSetup-x64-1.99.exe: Installers
  commercial-bank-statement-aug.pdf: Private
  nordic-icon-theme.tar.gz: Archives
  lecture-07-queuing-theory.pdf: Documents

# Used only when the models can't give a valid answer.
extension_fallback:
  Documents: [.pdf, .doc, .docx, .odt, .rtf, .txt, .md, .xls, .xlsx, .ods, .ppt, .pptx, .odp, .epub, .mobi, .djvu]
  Images: [.png, .jpg, .jpeg, .gif, .bmp, .webp, .svg, .ico, .psd, .ai, .heic, .tif, .tiff, .xcf]
  Videos: [.mp4, .mkv, .mov, .avi, .webm, .flv, .wmv, .m4v]
  Media: [.mp3, .wav, .flac, .m4a, .aac, .ogg, .wma, .mid]
  Archives: [.zip, .rar, .7z, .tar, .gz, .bz2, .xz, .zst, .tgz]
  Installers: [.exe, .msi, .appx, .msix, .apk, .deb, .rpm, .dmg, .pkg]
  Projects: [.py, .js, .ts, .jsx, .tsx, .java, .c, .cpp, .h, .cs, .go, .rs, .rb, .php, .sh, .ipynb, .csv, .tsv, .json,
             .yaml, .yml, .sql, .db, .ckpt, .pt, .pth, .onnx, .safetensors, .whl, .sln, .gradle]
  Web: [.html, .htm, .mhtml, .url, .webloc]
